  .header { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; flex-shrink: 0; }
  .stat-box {

  .stat-label { font-size: 0.62rem; color: #8fa8d8; text-transform: uppercase; letter-spacing: 0.7px; }
  .stat-value { font-size: 1.12rem; font-weight: 800; color: #7fffd4; text-shadow: 0 0 10px rgba(127,255,212,0.4); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .float-text {

  .modal-btn {

  .reset-btn {

</style>

<script>
// ============================================================
// 🚀 КОСМИЧЕСКАЯ ФЕРМА: ULTIMATE EDITION (v11.0)
// ============================================================

const SAVE_KEY = 'spaceFarm_ultimate_v11';

class BigVal {
  constructor(m = 0, e = 0) {
    if (m instanceof BigVal) { this.m = m.m; this.e = m.e; return; }
    if (typeof m === 'object' && m !== null && 'm' in m && 'e' in m) {
      this.m = Number(m.m) || 0; this.e = Number(m.e) || 0; this.normalize(); return;
    }
    this.m = Number(m) || 0; this.e = Number(e) || 0; this.normalize();
  }
  normalize() {
    if (!isFinite(this.m) || isNaN(this.m) || this.m === 0) { this.m = 0; this.e = 0; return this; }
    const sign = this.m < 0 ? -1 : 1;
    let absM = Math.abs(this.m);
    if (absM >= 10) {
      const shift = Math.floor(Math.log10(absM));
      absM /= Math.pow(10, shift);
      this.e += shift;
    } else if (absM < 1 && absM > 0) {
      const shift = Math.floor(Math.log10(absM));
      absM /= Math.pow(10, shift);
      this.e += shift;
    }
    this.m = sign * absM;
    return this;
  }
  static from(val) {
    if (val instanceof BigVal) return new BigVal(val.m, val.e);
    if (typeof val === 'object' && val !== null && 'm' in val) return new BigVal(val.m, val.e);
    return new BigVal(val, 0);
  }
  add(other) {
    const b = BigVal.from(other);
    if (this.m === 0) return new BigVal(b);
    if (b.m === 0) return new BigVal(this);
    const diff = this.e - b.e;
    if (diff > 15) return new BigVal(this);
    if (diff < -15) return new BigVal(b);
    if (diff >= 0) { return new BigVal(this.m + b.m * Math.pow(10, -diff), this.e); }
    else { return new BigVal(this.m * Math.pow(10, diff) + b.m, b.e); }
  }
  sub(other) { const b = BigVal.from(other); return this.add(new BigVal(-b.m, b.e)); }
  mul(other) {
    const b = BigVal.from(other);
    if (this.m === 0 || b.m === 0) return new BigVal(0, 0);
    return new BigVal(this.m * b.m, this.e + b.e);
  }
  div(other) {
    const b = BigVal.from(other);
    if (b.m === 0 || this.m === 0) return new BigVal(0, 0);
    return new BigVal(this.m / b.m, this.e - b.e);
  }
  pow(exp) {
    if (this.m <= 0) return new BigVal(0, 0);
    const log10Val = (Math.log10(this.m) + this.e) * exp;
    const newE = Math.floor(log10Val);
    const newM = Math.pow(10, log10Val - newE);
    return new BigVal(newM, newE);
  }
  gte(other) {
    const b = BigVal.from(other);
    if (this.m === 0 && b.m === 0) return true;
    if (this.m >= 0 && b.m < 0) return true;
    if (this.m < 0 && b.m >= 0) return false;
    if (this.m === 0) return b.m <= 0;
    if (b.m === 0) return this.m >= 0;
    if (this.e !== b.e) return this.m > 0 ? this.e > b.e : this.e < b.e;
    return this.m >= b.m - 1e-12;
  }
  toNumber() {
    if (this.e > 300) return 1e300;
    if (this.e < -300) return 0;
    return this.m * Math.pow(10, this.e);
  }
  format() {
    if (this.m <= 0) return '0';
    if (this.e < 3) {
      const val = this.toNumber();
      return val < 10 && val % 1 !== 0 ? val.toFixed(1) : Math.floor(val).toString();
    }
    const suffixes = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc', 'UDc', 'DDc', 'TDc', 'QaDc', 'QiDc'];
    const idx = Math.floor(this.e / 3);
    const rem = this.e % 3;
    const disp = this.m * Math.pow(10, rem);
    if (idx < suffixes.length) return disp.toFixed(2) + ' ' + suffixes[idx];
    return this.m.toFixed(2) + 'e' + this.e;
  }
}

];

  unlockedAch: {},
  upgrades: {
    pickaxe:   { level: 0, baseCost: 12,     name: 'Плазменный резак', icon: '⚔️', desc: '+1 урон клика',       type: 'click', value: 1, costMult: 1.15 },

let audioCtx = null;
function playTone(freq, type = 'sine', duration = 0.06, vol = 0.06) {
  if (!state.soundOn) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(freq * 1.25, audioCtx.currentTime + duration);
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + duration);
  } catch (e) {}
}

function toggleSound() {
  state.soundOn = !state.soundOn;
  document.getElementById('soundBtn').textContent = state.soundOn ? '🔊' : '🔇';
  saveGame();
}

function loadGame() {
  state = JSON.parse(JSON.stringify(DEFAULT_DATA));
  state.crystals = new BigVal(0);
  state.lifetimeEarned = new BigVal(0);
  state.enemyHp = new BigVal(15);
  state.enemyMaxHp = new BigVal(15);
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) {
      const p = JSON.parse(raw);
      if (p.crystals) state.crystals = BigVal.from(p.crystals);
      if (p.lifetimeEarned) state.lifetimeEarned = BigVal.from(p.lifetimeEarned);
      if (p.enemyHp) state.enemyHp = BigVal.from(p.enemyHp);
      if (p.enemyMaxHp) state.enemyMaxHp = BigVal.from(p.enemyMaxHp);
      for (const k of ['totalClicks','sector','wave','bossTimer','bossesKilled','prestigeCores','adminGodMultiplier','soundOn']) {
        if (p[k] !== undefined) state[k] = p[k];
      }
      if (p.unlockedAch) state.unlockedAch = p.unlockedAch;
      if (p.upgrades) {
        for (const k in state.upgrades) { if (p.upgrades[k] && typeof p.upgrades[k].level === 'number') state.upgrades[k].level = p.upgrades[k].level; }
      }
      if (p.research) {
        for (const k in state.research) { if (p.research[k] && typeof p.research[k].level === 'number') state.research[k].level = p.research[k].level; }
      }
    }
  } catch (e) {}
  document.getElementById('soundBtn').textContent = state.soundOn ? '🔊' : '🔇';
}
loadGame();

function saveGame() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) {}
}

function calcEnemyMaxHp(sector, wave) {
  const isBoss = wave === 10;
  const base = new BigVal(15, 0);
  const sectorScale = new BigVal(1.55, 0).pow(sector - 1);
  const waveScale = 1 + (wave - 1) * 0.12;
  let hp = base.mul(sectorScale).mul(waveScale);
  if (isBoss) hp = hp.mul(4);
  return hp;
}

function spawnEnemy(resetTimer = true) {
  const maxHp = calcEnemyMaxHp(state.sector, state.wave);
  state.enemyMaxHp = maxHp;
  state.enemyHp = new BigVal(maxHp);
  if (resetTimer && state.wave === 10) state.bossTimer = 30;
  updateEnemyVisuals();
}

function getGlobalDamageMult() {
  const achCount = Object.keys(state.unlockedAch).length;
  const achMult = 1 + achCount * 0.10;
  const prestigeMult = 1 + state.prestigeCores * 0.35;
  const adminM = state.adminGodMultiplier || 1;
  return new BigVal(achMult * prestigeMult * adminM, 0);
}

function getClickDamage() {
  let base = 1;
  for (const k in state.upgrades) {
    const u = state.upgrades[k];
    if (u.type === 'click') base += u.value * u.level;
  }
  const resMult = 1 + state.research.res1.level * state.research.res1.value;
  let dmg = new BigVal(base * resMult, 0).mul(getGlobalDamageMult());
  if (state.boosters.frenzy.active > 0) dmg = dmg.mul(state.boosters.frenzy.mult);
  if (state.boosters.overdrive.active > 0) dmg = dmg.mul(state.boosters.overdrive.mult);
  return dmg;
}

function getAutoDps() {
  let base = 0;
  for (const k in state.upgrades) {
    const u = state.upgrades[k];
    if (u.type === 'auto') base += u.value * u.level;
  }
  const resMult = 1 + state.research.res2.level * state.research.res2.value;
  let dps = new BigVal(base * resMult, 0).mul(getGlobalDamageMult());
  if (state.boosters.overdrive.active > 0) dps = dps.mul(state.boosters.overdrive.mult);
  return dps;
}

function getCritChance() { return Math.min(60, state.upgrades.critcore.level * state.upgrades.critcore.value); }
function getCritMult() { return 2.5 + state.research.res3.level * state.research.res3.value; }
function getLootMult() { return 1 + state.research.res4.level * state.research.res4.value; }

function dealDamage(amount, x = null, y = null, isCrit = false) {
  if (amount.m <= 0) return;
  state.enemyHp = state.enemyHp.sub(amount);

  if (x !== null && y !== null) {
    spawnFloatingText(x, y, (isCrit ? '💥 -' : '-') + amount.format(), isCrit);
    spawnSparks(x, y, isCrit ? 9 : 3);
  }

  if (state.enemyHp.m <= 0) {
    triggerExplosionAnimation();
    onEnemyDefeated();
  }
}

function triggerExplosionAnimation() {
  const area = document.getElementById('planetArea');
  area.classList.add('shake');
  setTimeout(() => area.classList.remove('shake'), 250);
  playTone(180, 'sawtooth', 0.18, 0.15);
}

function onEnemyDefeated() {
  const isBoss = state.wave === 10;
  let reward = state.enemyMaxHp.mul(isBoss ? 0.6 : 0.3).mul(getLootMult());
  if (reward.toNumber() < 3) reward = new BigVal(3, 0);

  state.crystals = state.crystals.add(reward);
  state.lifetimeEarned = state.lifetimeEarned.add(reward);

  const area = document.getElementById('planetArea');
  const rect = area.getBoundingClientRect();
  spawnFloatingText(rect.width / 2, rect.height / 2 - 25, `💎 +${reward.format()}`, true);

  if (isBoss) {
    state.bossesKilled++;
    playTone(900, 'triangle', 0.3, 0.15);
    showToast(`👹 БОСС УНИЧТОЖЕН! Переход в Сектор ${state.sector + 1}`);
    state.sector++;
    state.wave = 1;
  } else {
    playTone(520, 'sine', 0.08, 0.07);
    state.wave++;
  }

  spawnEnemy(true);
  checkAchievements();
  saveGame();
}

function getSingleCost(u, lvl) { return new BigVal(u.baseCost, 0).mul(new BigVal(u.costMult, 0).pow(lvl)); }

function getBulkPurchaseInfo(key, mode, isResearch = false) {
  const col = isResearch ? state.research : state.upgrades;
  const u = col[key];
  const maxAllowed = u.maxLevel ? Math.max(0, u.maxLevel - u.level) : 999999;
  if (maxAllowed === 0) return { count: 0, cost: new BigVal(0), maxed: true };

  if (mode === 1) return { count: 1, cost: getSingleCost(u, u.level), maxed: false };

  const calcSum = (n) => {
    let sum = new BigVal(0);
    for (let i = 0; i < n; i++) sum = sum.add(getSingleCost(u, u.level + i));
    return sum;
  };

  if (typeof mode === 'number') {
    const n = Math.min(mode, maxAllowed);
    return { count: n, cost: calcSum(n), maxed: false };
  }

  let count = 0, totalCost = new BigVal(0);
  while (count < Math.min(300, maxAllowed)) {
    const nextCost = getSingleCost(u, u.level + count);
    if (state.crystals.gte(totalCost.add(nextCost))) {
      totalCost = totalCost.add(nextCost); count++;
    } else break;
  }
  if (count === 0) return { count: 1, cost: getSingleCost(u, u.level), maxed: false };
  return { count, cost: totalCost, maxed: false };
}

// 3D Сцена с крушением и вращением
const area = document.getElementById('planetArea');
const canvas = document.getElementById('planetCanvas');
let scene, camera, renderer, targetGroup;

function init3D() {
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
  camera.position.z = 3.4;

  renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
  renderer.setSize(175, 175);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  scene.add(new THREE.AmbientLight(0xffffff, 0.8));
  const dirLight = new THREE.DirectionalLight(0xffffff, 1.4);
  dirLight.position.set(4, 4, 5);
  scene.add(dirLight);

  updateEnemyVisuals();

  function animate() {
    requestAnimationFrame(animate);
    if (targetGroup) {
      const isBoss = state.wave === 10;
      targetGroup.rotation.y += isBoss ? 0.015 : 0.007; // Заметное вращение планеты
      targetGroup.rotation.x += isBoss ? 0.008 : 0.003;
      targetGroup.scale.lerp(new THREE.Vector3(1, 1, 1), 0.18);
    }
    renderer.render(scene, camera);
  }
  animate();
}

function updateEnemyVisuals() {
  const isBoss = state.wave === 10;
  const hud = document.getElementById('bossHud');
  const nameEl = document.getElementById('enemyName');
  const zoneBadge = document.getElementById('zoneBadge');

  const secName = SECTOR_NAMES[(state.sector - 1) % SECTOR_NAMES.length];
  zoneBadge.textContent = `🪐 Сектор ${state.sector} • Волна ${state.wave}/10`;

  if (isBoss) {
    hud.classList.add('is-boss');
    const bName = BOSS_NAMES[(state.sector - 1) % BOSS_NAMES.length];
    nameEl.textContent = `⚠️ БОСС: ${bName}`;
  } else {
    hud.classList.remove('is-boss');
    nameEl.textContent = `☄️ ${secName} (Цель #${state.wave})`;
  }

  if (!scene) return;
  if (targetGroup) scene.remove(targetGroup);
  targetGroup = new THREE.Group();

  const palettes = [
    [0x3b82f6, 0x1d4ed8], [0x10b981, 0x047857], [0xa855f7, 0x6b21a8],
    [0xf59e0b, 0xb45309], [0xec4899, 0x9d174d], [0x06b6d4, 0x0e7490]
  ];
  const pal = isBoss ? [0xdc2626, 0x7f1d1d] : palettes[(state.sector - 1) % palettes.length];

  const coreGeo = isBoss ? new THREE.IcosahedronGeometry(1.05, 1) : new THREE.SphereGeometry(0.95, 28, 28);
  const coreMat = new THREE.MeshStandardMaterial({
    color: pal[0], emissive: pal[1], emissiveIntensity: isBoss ? 0.45 : 0.22,
    roughness: isBoss ? 0.3 : 0.45, metalness: isBoss ? 0.5 : 0.2, flatShading: isBoss
  });
  targetGroup.add(new THREE.Mesh(coreGeo, coreMat));

  if (isBoss) {
    const ringGeo = new THREE.TorusGeometry(1.38, 0.05, 8, 32);
    const ringMat = new THREE.MeshBasicMaterial({ color: 0xffd700 });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = Math.PI / 3;
    targetGroup.add(ring);
  }

  scene.add(targetGroup);
}

  prsTab.innerHTML = coresGain > 0 ? '🌟 Престиж<span class="tab-dot"></span>' : '🌟 Престиж';
  let html = `
    <div class="upgrade" style="flex-direction:column;align-items:flex-start;cursor:default;">
      <div style="font-size:0.9rem;font-weight:800;margin-bottom:6px;color:#ffd700;">🌟 Сингулярное Ядро</div>
      <div style="font-size:0.72rem;color:#b4c6e7;line-height:1.5;">
        Сбросьте сектор и флот ради ядер. Каждое ядро дает <b style="color:#7fffd4">+35%</b> к урону.<br>
        Текущие ядра: <b style="color:#ffd700">${state.prestigeCores} 🌟</b> (+${state.prestigeCores * 35}% урона)<br>
        При сбросе сейчас: <b style="color:#ffd700">+${coresGain} 🌟</b>
      </div>
    </div>`;
  if (coresGain > 0) {
    html += `<div class="upgrade affordable" onclick="doPrestige()" style="justify-content:center;padding:12px;font-weight:800;color:#ffd700;">🌟 ПЕРЕРОДИТЬСЯ (+${coresGain} 🌟)</div>`;
  } else {
    html += `<div class="upgrade locked" style="justify-content:center;padding:12px;font-size:0.74rem;text-align:center;">Победите Босса 2-го Сектора для открытия престижа</div>`;
  }
  document.getElementById('panel-prs').innerHTML = html;
}

function refreshVisiblePanel() {
  if (activeTab === 'upg') refreshUpgradesDOM();
  else if (activeTab === 'lab') refreshResearchDOM();
  else if (activeTab === 'bst') refreshBoostersDOM();
}

const achEl = document.getElementById('achievement');
let achTimer;
function checkAchievements() {
  let newlyUnlocked = false;
  for (const a of ACHIEVEMENTS) {
    if (!state.unlockedAch[a.id] && a.check(state)) {
      state.unlockedAch[a.id] = true; newlyUnlocked = true;
      achEl.textContent = `🏆 Награда: ${a.name} (+10% урона)`;
      achEl.classList.add('show');
      clearTimeout(achTimer);
      achTimer = setTimeout(() => achEl.classList.remove('show'), 3200);
      playTone(880, 'triangle', 0.25, 0.12);
    }
  }
  if (newlyUnlocked && activeTab === 'ach') renderAchievements();
}

function setBuyMode(mode, btn) {
  buyMode = mode;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  refreshVisiblePanel();
}

function buyUpgrade(key, isResearch = false) {
  const col = isResearch ? state.research : state.upgrades;
  const u = col[key];
  const info = getBulkPurchaseInfo(key, buyMode, isResearch);
  if (info.maxed) { showToast('Максимальный уровень!'); return; }
  if (state.crystals.gte(info.cost) && info.count > 0) {
    state.crystals = state.crystals.sub(info.cost);
    u.level += info.count;
    playTone(440, 'triangle', 0.08, 0.08);
    checkAchievements(); updateUI(); saveGame();
    showToast(`Улучшено: ${u.name} (+${info.count})`);
  } else { showToast('Недостаточно кристаллов!'); }
}

function buyBooster(key) {
  const b = state.boosters[key];
  if (!b.instant && b.active > 0) { showToast('Уже активно!'); return; }
  if (state.crystals.gte(b.cost)) {
    state.crystals = state.crystals.sub(b.cost);
    if (b.instant) {
      const strike = state.enemyMaxHp.mul(0.25);
      const rect = area.getBoundingClientRect();
      dealDamage(strike, rect.width / 2, rect.height / 2, true);
      showToast('☄️ Орбитальный удар снес 25% HP!');
    } else {
      b.active = b.duration;
      showToast(`Активировано: ${b.name}!`);
    }
    playTone(620, 'sawtooth', 0.14, 0.08);
    updateUI(); saveGame();
  } else { showToast('Недостаточно кристаллов!'); }
}

function doPrestige() {
  const coresGain = Math.max(0, Math.floor((state.sector - 2) * 1.5));
  if (coresGain < 1) return;
  if (confirm(`Переродиться и забрать +${coresGain} 🌟?`)) {
    state.prestigeCores += coresGain;
    state.crystals = new BigVal(0); state.sector = 1; state.wave = 1;
    for (const k in state.upgrades) state.upgrades[k].level = 0;
    for (const k in state.boosters) if (!state.boosters[k].instant) state.boosters[k].active = 0;
    spawnEnemy(true); checkAchievements(); updateUI(); renderPrestige(); saveGame();
    showToast(`Перерождение! +${coresGain} 🌟`);
  }
}

function resetGame() {
  if (confirm('Точно сбросить абсолютно весь прогресс?')) { localStorage.removeItem(SAVE_KEY); location.reload(); }
}

function switchTab(tabId, btn) {
  activeTab = tabId;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  if (btn) btn.classList.add('active');
  ['upg', 'lab', 'bst', 'ach', 'prs'].forEach(id => {
    document.getElementById('panel-' + id).classList.toggle('hidden', id !== tabId);
  });
  document.getElementById('buyModeBar').classList.toggle('hidden', tabId === 'ach' || tabId === 'prs');
  if (tabId === 'upg') refreshUpgradesDOM();
  if (tabId === 'lab') refreshResearchDOM();
  if (tabId === 'bst') refreshBoostersDOM();
  if (tabId === 'ach') renderAchievements();
  if (tabId === 'prs') renderPrestige();
}

function spawnFloatingText(x, y, text, isCrit = false) {
  const f = document.createElement('div');
  f.className = 'float-text' + (isCrit ? ' crit' : '');
  f.textContent = text; f.style.left = x + 'px'; f.style.top = y + 'px';
  area.appendChild(f);
  setTimeout(() => f.remove(), 750);
}

function spawnSparks(x, y, count = 5) {
  for (let i = 0; i < count; i++) {
    const s = document.createElement('div');
    s.className = 'spark'; s.style.left = x + 'px'; s.style.top = y + 'px';
    const a = Math.random() * Math.PI * 2; const d = 20 + Math.random() * 40;
    s.style.setProperty('--dx', Math.cos(a) * d + 'px');
    s.style.setProperty('--dy', Math.sin(a) * d + 'px');
    s.style.background = ['#6ee7ff', '#7fffd4', '#ffd700', '#ff6b81'][Math.floor(Math.random() * 4)];
    area.appendChild(s);
    setTimeout(() => s.remove(), 600);
  }
}

function handleTap(clientX, clientY) {
  let dmg = getClickDamage();
  const isCrit = Math.random() * 100 < getCritChance();
  if (isCrit) dmg = dmg.mul(getCritMult());

  state.totalClicks++;
  const rect = area.getBoundingClientRect();
  const x = clientX - rect.left; const y = clientY - rect.top;

  if (targetGroup) {
    targetGroup.scale.set(0.84, 0.84, 0.84);
    targetGroup.rotation.y += 0.12;
  }
  playTone(isCrit ? 580 : 310 + Math.random() * 50, 'sine', 0.05, isCrit ? 0.09 : 0.04);
  dealDamage(dmg, x, y, isCrit);
  updateUI();
}

area.addEventListener('pointerdown', (e) => {
  if (e.target.classList.contains('meteor')) return;
  e.preventDefault();
  handleTap(e.clientX, e.clientY);
});

const toastEl = document.getElementById('toast');
let tTimer;
function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(tTimer);
  tTimer = setTimeout(() => toastEl.classList.remove('show'), 2000);
}

// Пасхалки и Админ Панель
let adminTapCount = 0;
let adminTapTimer = null;
function adminTripleTap(e) {
  adminTapCount++;
  clearTimeout(adminTapTimer);
  adminTapTimer = setTimeout(() => { adminTapCount = 0; }, 1000);
  if (adminTapCount >= 3) {
    adminTapCount = 0;
    document.getElementById('adminModal').classList.remove('hidden');
    playTone(950, 'triangle', 0.2, 0.15);
  }
}
function closeAdminModal() { document.getElementById('adminModal').classList.add('hidden'); }
function adminAddCrystals() {
  state.crystals = state.crystals.add(1e6);
  state.lifetimeEarned = state.lifetimeEarned.add(1e6);
  showToast('👑 Админ: добавлено 1,000,000 кристаллов!');
  updateUI(); closeAdminModal();
}
function adminSkipBoss() {
  onEnemyDefeated();
  showToast('👑 Админ: волна/босс пропущены!');
  updateUI(); closeAdminModal();
}
function adminGodMode() {
  state.adminGodMultiplier = (state.adminGodMultiplier || 1) * 100;
  showToast(`👑 Админ: урон увеличен в 100 раз! (x${state.adminGodMultiplier})`);
  updateUI(); closeAdminModal();
}

function checkSecretEasterEgg() {
  showToast('👽 Пасхалка: Привет от разработчика! Ты нашел секретный бафф!');
  state.crystals = state.crystals.add(5000);
  updateUI();
}

// Игровой цикл DPS
setInterval(() => {
  const dps = getAutoDps();
  if (dps.m > 0) dealDamage(dps.div(10), null, null, false);

  if (state.wave === 10) {
    state.bossTimer -= 0.1;
    if (state.bossTimer <= 0) {
      showToast('⏳ Время вышло! Босс восстановил щиты.');
      spawnEnemy(true);
    }
  }

  for (const k in state.boosters) {
    if (!state.boosters[k].instant && state.boosters[k].active > 0) {
      state.boosters[k].active = Math.max(0, state.boosters[k].active - 0.1);
    }
  }
  updateUI();
}, 100);

// Несколько видов автокликеров с разной анимацией
let autoCursors = { tier1: null, tier2: null, tier3: null };
let autoAccumulators = { tier1: 0, tier2: 0, tier3: 0 };
let lastAutoTime = Date.now();

setInterval(() => {
  const now = Date.now();
  const dt = (now - lastAutoTime) / 1000;
  lastAutoTime = now;

  const configs = [
    { key: 'autoclick1', emoji: '🛸', name: 'tier1' },
    { key: 'autoclick2', emoji: '🐝', name: 'tier2' },
    { key: 'autoclick3', emoji: '⚡', name: 'tier3' }
  ];

  configs.forEach(cfg => {
    const upg = state.upgrades[cfg.key];
    const lvl = upg ? upg.level : 0;
    if (lvl <= 0) {
      if (autoCursors[cfg.name]) { autoCursors[cfg.name].remove(); autoCursors[cfg.name] = null; }
      return;
    }

    if (!autoCursors[cfg.name]) {
      const el = document.createElement('div');
      el.className = 'auto-cursor';
      el.textContent = cfg.emoji;
      area.appendChild(el);
      autoCursors[cfg.name] = el;
    }

    const speed = upg.value * lvl;
    autoAccumulators[cfg.name] += speed * dt;

    if (autoAccumulators[cfg.name] >= 1) {
      const hits = Math.floor(autoAccumulators[cfg.name]);
      autoAccumulators[cfg.name] -= hits;

      const rect = area.getBoundingClientRect();
      const tapX = rect.width / 2 + (Math.random() - 0.5) * 80;
      const tapY = rect.height / 2 + (Math.random() - 0.5) * 80;

      const cursorEl = autoCursors[cfg.name];
      cursorEl.style.left = tapX + 'px';
      cursorEl.style.top = tapY + 'px';
      cursorEl.classList.add('tap');
      setTimeout(() => { if (cursorEl) cursorEl.classList.remove('tap'); }, 80);

      let dmg = getClickDamage();
      const isCrit = Math.random() * 100 < getCritChance();
      if (isCrit) dmg = dmg.mul(getCritMult());
      const totalDmg = dmg.mul(hits);

      state.totalClicks += hits;
      if (targetGroup) targetGroup.scale.set(0.92, 0.92, 0.92);
      dealDamage(totalDmg, tapX, tapY - 15, isCrit);
    }
  });
}, 50);

setInterval(saveGame, 5000);
window.addEventListener('beforeunload', saveGame);

(function () {
  let starsHtml = '';
  for (let i = 0; i < 50; i++) {
    const size = (Math.random() * 2 + 0.8).toFixed(1);
    starsHtml += `<div class="star" style="width:${size}px;height:${size}px;left:${(Math.random()*100).toFixed(1)}%;top:${(Math.random()*100).toFixed(1)}%;animation-delay:${(Math.random()*3).toFixed(2)}s"></div>`;
  }
  document.getElementById('stars').innerHTML = starsHtml;
})();

buildUpgradesDOM();
buildResearchDOM();
buildBoostersDOM();
init3D();
updateEnemyVisuals();
checkAchievements();
updateUI();
renderAchievements();
renderPrestige();
</script>
</body>
</html>
